# ============================================================================
# Graddu 官网 Nginx 站点配置（正式版：HTTPS 模式）
# 目标域名：www.graddu.com, graddu.com
# 占位符：
#   __GRADDU_ROOT__   -> /opt/graddu
#   __SERVER_NAME__   -> www.graddu.com
#   __BACKEND_PORT__  -> 8082
#   __SSL_CERT__      -> /etc/letsencrypt/live/www.graddu.com/fullchain.pem
#   __SSL_KEY__       -> /etc/letsencrypt/live/www.graddu.com/privkey.pem
# ============================================================================

# ---------------- HTTP：证书验证 + 全站跳转 HTTPS ----------------
server {
    listen 80;
    listen [::]:80;
    server_name www.graddu.com graddu.com;

    # certbot 续期用的 HTTP-01 路径，必须放在跳转规则之前
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://www.graddu.com$request_uri;
    }

    access_log /var/log/nginx/graddu-access.log;
    error_log  /var/log/nginx/graddu-error.log warn;
    server_tokens off;
}

# ---------------- HTTPS：根域名 graddu.com 规范化跳转至 www.graddu.com ----------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name graddu.com;

    ssl_certificate     __SSL_CERT__;
    ssl_certificate_key __SSL_KEY__;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    location / {
        return 301 https://www.graddu.com$request_uri;
    }

    access_log /var/log/nginx/graddu-access.log;
    error_log  /var/log/nginx/graddu-error.log warn;
    server_tokens off;
}

# ---------------- HTTPS：正式站点 www.graddu.com ----------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.graddu.com;

    ssl_certificate     __SSL_CERT__;
    ssl_certificate_key __SSL_KEY__;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:GRADDUSSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # 安全响应头与强制 HTTPS (HSTS)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    access_log /var/log/nginx/graddu-access.log;
    error_log  /var/log/nginx/graddu-error.log warn;
    server_tokens off;

    # 客户端上传安装包与大文件限制 (350MB)
    client_max_body_size 350m;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/x-javascript text/javascript image/svg+xml;

    # API 接口反向代理至 Spring Boot 后端
    location /api/ {
        client_max_body_size 350m;
        proxy_pass http://127.0.0.1:__BACKEND_PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Connection        "";
        proxy_set_header Range             $http_range;
        proxy_set_header If-Range          $http_if_range;
        proxy_connect_timeout 30s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
    }

    # 前端 Vue 静态站点 (SPA)
    location / {
        root __GRADDU_ROOT__/www;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
