# ============================================================================
# Graddu 官网 Nginx 站点配置（引导版：HTTP 模式，用于 Let's Encrypt 证书申请）
# 目标域名：www.graddu.com, graddu.com
# 占位符：__GRADDU_ROOT__  __SERVER_NAME__  __BACKEND_PORT__
# 严格遵守多站点共存原则：
# 1. 绝不使用 default_server
# 2. 绝不影响既有其他站点
# ============================================================================
server {
    listen 80;
    listen [::]:80;
    server_name www.graddu.com graddu.com;

    access_log /var/log/nginx/graddu-access.log;
    error_log  /var/log/nginx/graddu-error.log warn;
    server_tokens off;

    # 客户端上传安装包大小限制（支持官网大文件与软件安装包发布）
    client_max_body_size 350m;

    # certbot HTTP-01 验证路径，必须放在最前面
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/x-javascript text/javascript image/svg+xml;

    # API 接口反向代理至 Spring Boot 后端
    location /api/ {
        client_max_body_size 350m;
        proxy_pass http://127.0.0.1:__BACKEND_PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Connection        "";
        proxy_set_header Range             $http_range;
        proxy_set_header If-Range          $http_if_range;
        proxy_connect_timeout 30s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
    }

    # 前端 Vue 静态站点
    location / {
        root __GRADDU_ROOT__/www;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
